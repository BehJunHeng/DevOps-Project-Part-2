<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CapyCook - Recipe Manager</title>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <script src="js/view-recipes.js"></script>
  <script src="js/calvin.js"></script>
</head>

<body onload="viewRecipes()">
  <div class="container mt-5">
    <div class="text-center">
      <img src="images/CAPY2.jpg" alt="CapyCook logo" class="logo">
      <h2 class="mt-3">CapyCook Recipe Manager</h2>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-8 text-right">
        <a href="add-recipe.html" class="btn btn-primary">
          Add Recipe
        </a>
      </div>
    </div>

    <div class="row justify-content-center mt-3">
      <div class="col-md-8">
        <div id="feedbackAlert" class="alert d-none" role="alert"></div>
        <table class="table table-hover table-striped-custom">
          <thead>
            <tr>
              <th>ID</th>
              <th>Recipe</th>
              <th>Description</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tableContent">
          </tbody>
        </table>
      </div>
    </div>
  </div>


  </div>
  </div>
</body>

</html>
