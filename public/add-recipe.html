<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CapyCook - Add Recipe</title>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Teammate and Individual Scripts -->
    <script src="js/recipe-details.js"></script>
    <script src="js/beh-jun-heng.js"></script>
    <script src="js/calvin.js"></script>
    <script src="js/quek-han-xi.js"></script>
    <script src="js/suresh-babu-bhavesh.js" defer></script>

    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <nav class="navbar navbar-light bg-light border-bottom">
        <a class="navbar-brand" href="index.html">
            <img src="images/CAPY2.jpg" alt="CapyCook Logo" width="40" /> CapyCook
        </a>
    </nav>

    <div class="container mt-4 mb-5">

        <a href="index.html">&lsaquo; Back to Recipes</a>

        <h2 class="mt-3">Add a New Recipe</h2>

        <form id="recipeForm">

            <!-- Recipe Details -->
            <div class="card p-3 mb-3">
                <h4>Recipe Details</h4>

                <div class="form-group">
                    <label for="name">Recipe Name</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Chicken Alfredo"
                        maxlength="80" required>
                    <small class="form-text text-muted">Maximum 80 characters.</small>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="2"
                        placeholder="e.g. Tasty and easy dinner" maxlength="500" required></textarea>
                    <small class="form-text text-muted">Maximum 500 characters.</small>
                </div>

                <div class="form-group">
                    <label for="servings">Servings</label>
                    <input type="number" class="form-control" id="servings" name="servings" min="1" step="1" required>
                </div>
            </div>

            <!-- Ingredients -->
            <div class="card p-3 mb-3">
                <h4>Ingredients</h4>

                <ul id="ingredientsList" class="list-group mb-3">
                    <!-- Ingredients will appear here -->
                </ul>

                <button type="button" onclick="addIngredientToRecipe()" class="btn btn-secondary btn-sm">
                    + Add Ingredient
                </button>
            </div>

            <!-- Add Ingredient Modal -->
            <div class="modal fade" id="ingredientModal" tabindex="-1" role="dialog" aria-hidden="true">

                <div class="modal-dialog" role="document">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title">Add Ingredient</h5>
                            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>

                        <div class="modal-body">

                            <div class="form-group">
                                <label for="ingredientName">Ingredient Name</label>
                                <input type="text" id="ingredientName" class="form-control" placeholder="e.g. Chicken">
                            </div>

                            <div class="form-group">
                                <label for="ingredientQuantity">Quantity</label>
                                <input type="number" id="ingredientQuantity" class="form-control" min="0.01" step="any"
                                    placeholder="e.g. 2">
                            </div>

                            <div class="form-group">
                                <label for="ingredientUnit">Unit</label>
                                <select id="ingredientUnit" class="form-control">
                                    <option value="">Select a unit</option>
                                    <option value="cup">cup</option>
                                    <option value="pcs">pcs</option>
                                    <option value="clove">clove</option>
                                    <option value="tbsp">tbsp</option>
                                    <option value="tsp">tsp</option>
                                    <option value="g">g</option>
                                    <option value="kg">kg</option>
                                    <option value="ml">ml</option>
                                    <option value="l">l</option>
                                    <option value="pinch">pinch</option>
                                    <option value="slice">slice</option>
                                </select>
                            </div>

                            <div class="form-check">
                                <input type="checkbox" id="ingredientMandatory" class="form-check-input">
                                <label class="form-check-label" for="ingredientMandatory">
                                    Mandatory ingredient
                                </label>
                            </div>

                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                            <button type="button" class="btn btn-primary" onclick="saveIngredientToRecipe()">
                                Add Ingredient
                            </button>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Cooking Steps -->
            <div class="card p-3 mb-3">
                <h4>Cooking Steps</h4>

                <!-- Input for a new cooking step -->
                <div class="form-group">
                    <label for="stepInput">Enter a cooking step</label>
                    <textarea class="form-control" id="stepInput" rows="2"
                        placeholder="e.g. Cook the rice and let it cool."></textarea>
                </div>

                <button type="button" id="addStep" class="btn btn-secondary btn-sm mb-3">
                    + Add Step
                </button>


                <div id="stepsContainer">
                    <!-- Added cooking steps will appear here -->
                </div>
            </div>

            <button type="submit" class="btn btn-success">
                Add Recipe
            </button>

        </form>

        <div id="message" class="mt-3"></div>

    </div>

</body>

</html>
