<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapyCook - Recipe Details</title>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <script src="js/recipe-details.js"></script>
    <script src="js/quek-han-xi.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body onload="viewRecipeDetails()">

    <!-- navigational bar-->
    <nav class="navbar navbar-light bg-light border-bottom">
        <a class="navbar-brand" href="index.html"><img src="images/CAPY2.jpg" alt="CapyCook Logo" width="40"> CapyCook
        </a>
    </nav>
    <!--back to recipes button-->
    <div class="container mt-4">
        <a href="index.html">&lsaquo; Back to Recipes</a>

        <div id="errorMessage" class="alert alert-danger mt-3 d-none"></div>

        <div id="recipeDetails" class="d-none">

            <!--recipe info and the add ingredient, edit recipe, remove ingredient buttons-->
            <div class="card mt-3">
                <div class="card-body d-flex justify-content-between align-items-start flex-wrap">
                    <div>
                        <h2 id="recipeName"></h2>
                        <p id="recipeDescription" class="mb-1"></p>
                        <small class="text-muted">
                            ID: <span id="recipeId"></span> &nbsp; Servings: <span id="recipeServings"></span>
                        </small>
                    </div>
                    <div class="mt-2">
                        <button type="button" class="btn btn-warning" id="editBtn">Edit</button>
                        <button type="button" class="btn btn-success" id="addIngredientBtn">Add Ingredient</button>
                        <button type="button" class="btn btn-danger" id="removeIngredientBtn" data-toggle="modal"
                            data-target="#removeIngredientModal" onclick="openRemoveIngredient()">Remove
                            Ingredient</button>

                    </div>
                </div>
            </div>
            <div class="card mt-3">
                <div class="card-header d-flex justify-content-between">
                    <strong>Ingredients</strong>
                    <span id="ingredientCount"></span>
                </div>
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th>Ingredient</th>
                            <th>Quantity</th>
                            <th>Unit</th>
                            <th>Type</th>
                        </tr>
                    </thead>
                    <tbody id="ingredientsContent">
                    </tbody>
                </table>
            </div>
            <div class="card mt-3 mb-5">
                <div class="card-header"><strong>Steps</strong></div>
                <div class="card-body">
                    <ol id="stepsContent" class="mb-0"></ol>
                </div>
            </div>
        </div>
    </div>
    <!--Remove ingredient pop-up modal-->
    <div class="modal fade" id="removeIngredientModal" tabindex="-1" role="dialog" aria-labelledby="removeTitle"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="removeTitle">Remove Ingredient</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p class="mb-1">Ingredients in this recipe</p>
                    <ul id="removeList"></ul>

                    <div class="form-group">
                        <label for="removeName">Ingredient to Remove</label>
                        <input type="text" class="form-control" id="removeName" placeholder="e.g. egg">
                        <small class="form-text text-muted">Letters and spaces only, maximum 30 characters</small>
                    </div>
                    <div id="removeMessage">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-danger" onclick="removeIngredient()">Remove Ingredient</button>

                </div>
            </div>
        </div>
    </div>
</body>

</html>
